<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiveclipse</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e0d4ee, #c9b6e4);
    font-family: 'Poppins', sans-serif;
}

/* Container */
.loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Logo */
.logo {
    width: 170px;
    animation: pulse 1.8s infinite ease-in-out;
}

/* Zoom animation */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

/* Loading text */
.loading-text {
    margin-top: 15px;
    font-size: 18px;
    color: white;
    letter-spacing: 1px;
}

/* Start button */
.start-btn {
    margin-top: 12px;
    padding: 12px 45px;
    background-color: #b79bd6;
    color: white;
    border: none;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    display: none;
    transition: 0.3s ease;
}

.start-btn:hover {
    background-color: #a685cb;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="loader-container">
    <img class="logo" 
         src="https://i.ibb.co.com/mrNSs5TX/fiveclipse-logo-1.png" 
         alt="Fiveclipse Logo">

    <div class="loading-text" id="loadingText">
        Loading (<span id="percent">0</span>%)
    </div>

    <button class="start-btn" id="startBtn">
        START
    </button>
</div>

<script>
let percent = 0;
let loading = document.getElementById("percent");
let loadingText = document.getElementById("loadingText");
let startBtn = document.getElementById("startBtn");

let interval = setInterval(() => {
    percent++;
    loading.textContent = percent;

    if (percent >= 100) {
        clearInterval(interval);
        loadingText.style.display = "none";
        startBtn.style.display = "inline-block";
    }
}, 40);

// Redirect kalau tombol diklik
startBtn.addEventListener("click", function() {
    window.location.href = "home.html"; // ganti sesuai halaman kamu
});
</script>

</body>
</html>
